<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3d59">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Campus Tracker</title>
<style>
:root{--n:#1e3d59;--c:#f5f0e1;--o:#ff6e40;--y:#ffc13b;--s:#fff;--b:#e6dec8;--m:#6b7c8d}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,sans-serif;background:var(--c);color:var(--n);padding-bottom:78px}
main{max-width:920px;margin:auto;padding:16px}
nav{position:fixed;z-index:5;left:0;right:0;bottom:0;background:var(--n);display:flex;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav[hidden]{display:none!important}
nav button{border:0;background:none;color:#b9c7d6;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:70px;padding:7px 4px;font-size:10.5px;white-space:nowrap;border-radius:12px;margin:0}
nav .on{background:#ffffff1c;color:var(--y);font-weight:700}
.card{background:var(--s);border-radius:18px;padding:14px;margin:0 0 12px;box-shadow:0 1px 3px #1e3d5914}
h2{margin:4px 0 14px;font-size:24px}h3{margin:0 0 6px;font-size:16px}small,.sub{color:var(--m);font-size:13px}
button,input,select,textarea{font:inherit;color:inherit;border-radius:12px;border:1.5px solid var(--b);background:#fff;padding:10px;width:100%;margin:4px 0}
button{width:auto;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.pri{background:var(--o);color:#fff;border:0;font-weight:600;border-radius:99px;padding:9px 18px}
.ic{padding:8px;min-height:38px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.chip{background:#fff3d1;color:#8a5a00;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600}
.red{color:#d33}.chip.red{background:#ffe0d6;color:#c2410c}
.hero{background:linear-gradient(135deg,#1e3d59,#2b5a82);color:#fff;border-radius:24px;padding:22px;margin-bottom:12px;border-bottom:5px solid var(--o)}
.hero h2{margin:0 0 4px;font-size:26px}.hero small{color:#c9d6e3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:#fff;border-radius:18px;padding:14px;border-left:5px solid var(--y)}.tile:nth-child(2){border-color:var(--o)}.tile:nth-child(3){border-color:var(--n)}
.tile b{display:block;font-size:24px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}.tabs button{flex:1;min-width:58px;flex-direction:column;gap:0;margin:0;border-radius:14px}
.tabs .on{background:var(--n);color:#fff;border-color:var(--n)}
.cls{border-left:6px solid;display:flex;gap:12px}.cls .t{font-weight:700;min-width:54px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.note{border-radius:16px;padding:10px}.note textarea{background:transparent;border:0;min-height:100px;resize:none;margin:0;padding:4px}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;margin-right:6px;border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px #0002}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:12px;color:var(--m)}.cell{aspect-ratio:1;flex-direction:column;gap:2px;padding:2px;margin:0;border-radius:12px;min-height:0}
.cell.sel{background:var(--n);color:#fff}.cell.today{border-color:var(--o)}.dots i{display:inline-block;width:6px;height:6px;border-radius:50%;margin:0 1px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{color:var(--m);font-size:12px}
td select{padding:6px;margin:0;width:70px}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:var(--c);width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px;border-radius:24px 24px 0 0}
textarea{min-height:90px}label{display:block;font-size:13px;color:var(--m);margin-top:6px}
@media(min-width:900px){body{padding:0 0 0 250px}
 nav{top:0;right:auto;width:250px;flex-direction:column;overflow:auto;padding:24px 14px}
 nav::before{content:"Campus Tracker";color:#fff;font-weight:800;font-size:19px;padding:2px 12px 20px;border-bottom:3px solid var(--o);margin-bottom:14px}
 nav button{flex-direction:row;font-size:14.5px;gap:12px;padding:12px 14px;min-width:0;justify-content:flex-start}
 .modal{align-items:center}.modal>div{border-radius:24px}main{padding:28px}}
.bar{height:8px;background:#ece5d0;border-radius:9px;overflow:hidden;margin:6px 0 10px}.bar i{display:block;height:100%;background:var(--o);border-radius:9px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#1e3d59;color:#fff;padding:10px 16px;border-radius:99px;z-index:20;font-size:13px;max-width:90%;text-align:center}
</style></head><body>
<main id="app">Memuat…</main><nav id="nav" hidden></nav><div id="mod"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const showErr=m=>{document.getElementById('app').innerHTML='<div class=card><h3>⚠ Aplikasi gagal dimuat</h3><p>'+String(m).replace(/</g,'&lt;')+'</p><small>Cek config.js dan pastikan update1.sql sudah dijalankan.</small><br><br><button class=pri onclick=location.reload()>Muat ulang</button></div>'};
addEventListener('error',e=>showErr(e.message));addEventListener('unhandledrejection',e=>showErr(e.reason?.message||e.reason));
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const key=d=>{d=new Date(d);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const D=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'],DS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const COL=['#1e3d59','#ff6e40','#d99a00','#2a9d8f','#8e6bbf','#d6457a'],MC=['#fff0b8','#ffd9cc','#d6e6f5','#d8f0e0','#e8dcf5'];
const col=s=>COL[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length];
const BW={A:4,'A-':3.7,'B+':3.3,B:3,'B-':2.7,'C+':2.3,C:2,D:1,E:0},ST=['Belum','Proses','Selesai'],PR=['Rendah','Sedang','Tinggi'];
const MIN=+localStorage.minAbs||75;
const fd=v=>v?new Date(v).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'}):'-';
const rp=n=>'Rp '+Math.round(n||0).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',book:'<path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/>',task:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2h9"/>',cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',flag:'<path d="M5 21V4M5 4h12l-2 4 2 4H5"/>',cap:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',user:'<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M16 11l2 2 4-4"/>',rec:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',clip:'<path d="M21 11l-9 9a5 5 0 01-7-7l9-9a3 3 0 014 4l-9 9a1 1 0 01-2-2l8-8"/>',chk:'<path d="M5 12l5 5 9-10"/>',l:'<path d="M15 6l-6 6 6 6"/>',r:'<path d="M9 6l6 6-6 6"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'};
const I=(n,z=20)=>`<svg viewBox="0 0 24 24" width=${z} height=${z} fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round>${P[n]}</svg>`;
const M={
tasks:{t:'My Task',f:[['title','Nama tugas'],['course','Mata kuliah'],['description','Deskripsi','area'],['deadline','Deadline','dt'],['priority','Prioritas','sel',PR],['status','Status','sel',ST],['note','Catatan','area']],h:r=>r.title,s:r=>`${r.course||''} · ${fd(r.deadline)} · ${r.priority}`,done:1,q:1,sort:(a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9')},
deadlines:{t:'Deadline',f:[['title','Nama'],['category','Kategori','sel',['Tugas','Pembayaran','UKT/SPP','KRS','Registrasi','Ujian','Administrasi','Agenda','Lainnya']],['due','Tanggal & jam','dt'],['priority','Prioritas','sel',PR],['status','Status','sel',ST],['note','Deskripsi','area']],h:r=>r.title,s:r=>`${r.category} · ${fd(r.due)}`,done:1,sort:(a,b)=>a.due.localeCompare(b.due)},
attendance:{t:'Absensi',f:[['course','Mata kuliah'],['date','Tanggal','date'],['status','Status','sel',['Hadir','Izin','Sakit','Alpa','Libur']],['note','Catatan pertemuan']],h:r=>r.course,s:r=>`${r.date} · ${r.status} ${r.note?'· '+r.note:''}`,sort:(a,b)=>b.date.localeCompare(a.date)},
payments:{t:'Bukti Pembayaran',f:[['title','Nama pembayaran'],['category','Kategori','sel',['UKT/SPP','Registrasi','Praktikum','Buku & materi','Transportasi','Peralatan','Lainnya']],['amount','Nominal','number'],['date','Tanggal bayar','date'],['semester','Semester','number'],['file_path','Foto / PDF bukti','file'],['note','Catatan','area']],h:r=>`${r.title} — ${rp(r.amount)}`,s:r=>`${r.category} · ${r.date} · Smt ${r.semester||'-'}${r.file_path?' · 📎 ada bukti':' · belum ada bukti'}`,sort:(a,b)=>b.date.localeCompare(a.date)},
courses:{t:'Jadwal Makul',f:[['name','Nama makul'],['code','Kode'],['lecturer','Dosen'],['day','Hari','sel',D],['start_time','Mulai','time'],['end_time','Selesai','time'],['room','Ruangan'],['semester','Semester','number'],['sks','SKS','number'],['note','Catatan','area']]},
grades:{t:'Academic Progress',f:[['course_name','Mata kuliah'],['code','Kode'],['semester','Semester','number'],['sks','SKS','number'],['metode','Metode / layanan (mis. Pr · Pro)'],['letter','Nilai huruf (kosong = belum ada)','sel',['',...Object.keys(BW)]]]}
};
const NAV=[['dash','Dashboard','home'],['courses','Jadwal Makul','book'],['tasks','My Task','task'],['cal','My Calendar','cal'],['deadlines','Deadline','flag'],['grades','Academic Progress','cap'],['attendance','Absensi','user'],['vault','Info Akun','lock'],['payments','Bukti Pembayaran','rec'],['set','Setting','cog']];
let cache={},page='dash',user,ep,selDay=new Date().getDay(),cm=new Date(new Date().getFullYear(),new Date().getMonth(),1),cd=key(new Date());
const load=async k=>{const{data,error}=await sb.from(k).select('*');if(error)throw error;return cache[k]=(data||[]).sort(M[k]?.sort||((a,b)=>(a.start_time||'').localeCompare(b.start_time||'')||(a.semester-b.semester)||0))};

async function boot(){
 let{data}=await sb.auth.getSession();user=data.session?.user;
 if(!user){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error;user=r.data.user}
 await Promise.all(['courses','grades','tasks','deadlines'].map(k=>load(k))).catch(()=>0);setInterval(async()=>{try{await Promise.all([load('tasks'),load('deadlines')]);remind()}catch(e){}},60000);remind();$('#nav').hidden=false;render();
}
const go=k=>{page=k;render()};
async function render(){
 $('#nav').innerHTML=NAV.map(([k,l,i])=>`<button class="${k==page?'on':''}" onclick="go('${k}')">${I(i)}<span>${l}</span></button>`).join('');
 const a=$('#app');a.innerHTML='Memuat…';scrollTo(0,0);
 if(page=='dash')return dash(a);if(page=='courses')return pgCourses(a);if(page=='cal')return pgCal(a);if(page=='grades')return pgGrades(a);if(page=='vault')return pgVault(a);if(page=='set')return pgSet(a);
 const m=M[page],rows=await load(page);let top='';
 if(page=='attendance'){await load('courses');top=quick()+absSum(rows)}
 if(page=='payments')top=paySum(rows);
 if(m.done)top=chips(rows);
 a.innerHTML=`<div class=row><h2>${m.t}</h2><button class=pri onclick="edit()">${I('plus',18)} Tambah</button></div>${top}${m.q?'<input id=q placeholder="Cari…" oninput="filt()">':''}<div id=list>${list(flrows(rows))}</div>`;
}
const stat=r=>{const d=r.due||r.deadline;if(r.status=='Selesai')return'Completed';if(!d)return'';const t=new Date(d),n=new Date();return t<n?'Overdue':t.toDateString()==n.toDateString()?'Due Today':'Upcoming'};
function list(rows){const m=M[page];return rows.map(r=>{const s=m.done?stat(r):'';return`<div class=card style="border-left:6px solid ${s=='Overdue'?'#d33':s=='Due Today'?'#ff6e40':s=='Completed'?'#b9c0c7':'#1e3d59'};${s=='Completed'?'opacity:.6':''}"><div class=row><div><h3>${esc(m.h(r))}</h3><div class=sub>${esc(m.s(r))}</div></div>${s?`<span class="chip ${s=='Overdue'?'red':''}">${s}</span>`:''}</div><div class=row style="justify-content:flex-start;margin-top:6px">${m.done?`<button class=ic onclick="tog('${r.id}')">${I('chk',18)} ${r.status=='Selesai'?'Buka lagi':'Selesai'}</button>`:''}${r.file_path?`<button class=ic onclick="openF('${esc(r.file_path)}')">${I('clip',18)} Lihat bukti</button>`:''}<button class=ic onclick="edit('${r.id}')">${I('edit',18)}</button><button class=ic onclick="del('${r.id}')">${I('trash',18)}</button></div></div>`}).join('')||'<p class=sub>Belum ada data.</p>'}
const fl={tasks:'Semua',deadlines:'Semua'},FC=['Semua','Upcoming','Due Today','Overdue','Completed'];
const flrows=rows=>fl[page]&&fl[page]!='Semua'?rows.filter(r=>stat(r)==fl[page]):rows;
const chips=rows=>{const dn=rows.filter(r=>r.status=='Selesai').length,pc=rows.length?dn/rows.length*100:0;return`<div class=card><div class=row><small>${dn} dari ${rows.length} selesai</small><b>${Math.round(pc)}%</b></div><div class=bar><i style="width:${pc}%"></i></div></div><div class=tabs>${FC.map(c=>`<button class="${fl[page]==c?'on':''}" onclick="fl[page]='${c}';render()"><b>${rows.filter(r=>c=='Semua'||stat(r)==c).length}</b><small style="color:inherit">${c}</small></button>`).join('')}</div>`};
const filt=()=>{const q=($('#q')?.value||'').toLowerCase();$('#list').innerHTML=list(flrows(cache[page]).filter(r=>JSON.stringify(r).toLowerCase().includes(q)))};
const paySum=rows=>{const by={},cat={};rows.forEach(r=>{const k='Semester '+(r.semester||'-');by[k]=(by[k]||0)+(+r.amount||0);cat[r.category]=(cat[r.category]||0)+(+r.amount||0)});const tot=rows.reduce((x,r)=>x+(+r.amount||0),0);return`<div class=hero><small>Total pembayaran tercatat</small><h2>${rp(tot)}</h2><small>${rows.length} bukti · ${rows.filter(r=>r.file_path).length} sudah ada foto</small></div><div class=card><h3>Per semester</h3>${Object.entries(by).map(([k,v])=>`<div class=row><span>${k}</span><b>${rp(v)}</b></div>`).join('')||'<small>Belum ada</small>'}</div><div class=card><h3>Per kategori</h3>${Object.entries(cat).map(([k,v])=>`<div class=row><span>${esc(k)}</span><b>${rp(v)}</b></div>`).join('')||'<small>Belum ada</small>'}</div>`};
let tc=[];
const quick=()=>{tc=(cache.courses||[]).filter(c=>c.day==D[new Date().getDay()]);return`<div class=card><h3>Absen cepat hari ini</h3>${tc.map((c,i)=>`<div style="margin-bottom:8px"><b>${esc(c.name)}</b> <small>${c.start_time||''}</small><div class=row style="justify-content:flex-start">${['Hadir','Izin','Sakit','Alpa','Libur'].map(x=>`<button class=ic onclick="qa(${i},'${x}')">${x}</button>`).join('')}</div></div>`).join('')||'<small>Tidak ada kelas terjadwal hari ini. Atur lewat Jadwal Makul.</small>'}</div>`};
const qa=async(i,x)=>{await sb.from('attendance').insert({course:tc[i].name,date:key(new Date()),status:x});render()};
async function tog(id){const r=cache[page].find(x=>x.id==id);await sb.from(page).update({status:r.status=='Selesai'?'Belum':'Selesai'}).eq('id',id);render()}
async function del(id,pg){if(confirm('Hapus data ini?')){await sb.from(pg||page).delete().eq('id',id);render()}}
async function openF(p){const w=window.open('');const{data,error}=await sb.storage.from('bukti').createSignedUrl(p,300);if(error){w.close();return alert(error.message)}w.location=data.signedUrl}

/* form */
const loc=v=>v?new Date(new Date(v)-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16):'';
function edit(id,pg,pre){
 ep=pg||page;const m=M[ep],r=id?(cache[ep]||[]).find(x=>x.id==id):(pre||{});
 $('#mod').innerHTML=`<div class=modal><div><h3>${id?'Edit':'Tambah'} · ${m.t}</h3>${m.f.map(([k,l,t,o],i)=>{const v=r[k]??'';return`<label>${l}${t=='file'?`<input id=f${i} type=file accept="image/jpeg,image/png,application/pdf">${v?'<small>Sudah ada file. Pilih lagi untuk mengganti.</small>':''}`:t=='sel'?`<select id=f${i}>${o.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:t=='area'?`<textarea id=f${i}>${esc(v)}</textarea>`:`<input ${k=='course'||k=='course_name'?'list=dl ':''}id=f${i} type="${t=='dt'?'datetime-local':t||'text'}" value="${esc(t=='dt'?loc(v):v)}">`}</label>`}).join('')}<datalist id=dl>${[...new Set([...(cache.courses||[]).map(x=>x.name),...(cache.grades||[]).map(x=>x.course_name)])].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class=row style="margin-top:10px"><button class=pri onclick="save('${id||''}')">Simpan</button><button onclick="$('#mod').innerHTML=''">Batal</button></div></div></div>`;
}
async function save(id){
 const o={};let fi=null;
 M[ep].f.forEach(([k,,t],i)=>{if(t=='file'){fi=[k,$('#f'+i).files[0]];return}let v=$('#f'+i).value;o[k]=v===''?null:t=='dt'?new Date(v).toISOString():t=='number'?+v:v});
 if(fi&&fi[1]){const f=fi[1];if(f.size>5e6||!/^(image\/(jpeg|png)|application\/pdf)$/.test(f.type))return alert('File harus JPG, PNG, atau PDF dan maksimal 5 MB');
  const path=user.id+'/'+Date.now()+'-'+f.name.replace(/[^\w.]/g,'_');const u=await sb.storage.from('bukti').upload(path,f);if(u.error)return alert(u.error.message);o[fi[0]]=path}
 const{error}=await(id?sb.from(ep).update(o).eq('id',id):sb.from(ep).insert(o));
 if(error)return alert(error.message);$('#mod').innerHTML='';render();
}

/* jadwal per hari */
async function pgCourses(a){
 const rows=await load('courses'),cnt=d=>rows.filter(r=>r.day==D[d]).length,day=rows.filter(r=>r.day==D[selDay]);
 a.innerHTML=`<div class=row><h2>Jadwal Makul</h2><button class=pri onclick="edit(0,'courses')">${I('plus',18)} Tambah</button></div>
 <div class=tabs>${[1,2,3,4,5,6,0].map(d=>`<button class="${d==selDay?'on':''}" onclick="selDay=${d};pgCourses($('#app'))"><b>${DS[d]}</b><small style="color:inherit">${cnt(d)} kelas</small></button>`).join('')}</div>
 <h3>${D[selDay]}</h3>${day.map(r=>`<div class="card cls" style="border-color:${col(r.name)}"><div class=t>${r.start_time||''}<br><small>${r.end_time||''}</small></div><div style="flex:1"><h3>${esc(r.name)}</h3><div class=sub>${esc(r.code||'')} · ${esc(r.room||'-')} · ${esc(r.lecturer||'-')}</div><div class=row style="justify-content:flex-start;margin-top:4px"><button class=ic onclick="edit('${r.id}','courses')">${I('edit',18)}</button><button class=ic onclick="del('${r.id}','courses')">${I('trash',18)}</button></div></div></div>`).join('')||'<p class=sub>Tidak ada kelas di hari ini.</p>'}`;
}

/* kalender */
async function pgCal(a){
 const[c,t,d]=await Promise.all(['courses','tasks','deadlines'].map(load));

/* Info Akun / Account Vault (AES-256-GCM, kunci dari Master Password via PBKDF2) */
let VK=null,V=[],VM=null,vlt,vsh={};
const enc=new TextEncoder(),dec=new TextDecoder(),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
const dkey=async(pw,salt)=>{const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const seal=async o=>{const iv=crypto.getRandomValues(new Uint8Array(12));return b64(iv)+'.'+b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},VK,enc.encode(JSON.stringify(o))))};
const unseal=async x=>{const[i,c]=x.split('.');return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(i)},VK,ub(c))))};

function vlist(){const q=($('#vq').value||'').toLowerCase(),c=$('#vc').value;
 $('#vl').innerHTML=V.map((v,i)=>[v,i]).filter(([v])=>(!c||v.cat==c)&&(!q||(v.name||'').toLowerCase().includes(q))).sort((a,b)=>(b[0].fav?1:0)-(a[0].fav?1:0)).map(([v,i])=>`<div class=card><div class=row><div style="display:flex;gap:10px;align-items:center">${I(VI[VC.indexOf(v.cat)]||'lock',26)}<div><h3 style="margin:0">${esc(v.name)}</h3><small>${esc(v.cat||'')}${v.owner?' · '+esc(v.owner):''}</small></div></div><span>${Date.now()-new Date(v.upd)>1.5e10?'<span class="chip red">Perlu diperbarui</span> ':''}<button class=ic onclick="vfav(${i})" style="${v.fav?'color:#d99a00':''}">${I('star',18)}</button></span></div>
 ${v.email?`<div class=row><small>Email</small><span>${esc(v.email)}</span></div>`:''}${v.username?`<div class=row><small>${v.cat&&v.cat[0]=='D'?'NIM':'Username'}</small><span>${esc(v.username)}</span></div>`:''}${v.password?`<div class=row><small>Password</small><span>${vsh[i]?esc(v.password):'••••••••••'}</span></div>`:''}${v.note?`<small>${esc(v.note)}</small>`:''}
 <div class=row style="justify-content:flex-start;margin-top:6px">${v.url?`<a href="${esc(v.url)}" target=_blank rel=noopener><button class=ic>${I('ext',18)} Buka</button></a>`:''}${v.email?`<button class=ic onclick="vcp(${i},'email')">${I('copy',18)} Email</button>`:''}${v.username?`<button class=ic onclick="vcp(${i},'username')">${I('copy',18)} User</button>`:''}${v.password?`<button class=ic onclick="vcp(${i},'password')">${I('copy',18)} Pass</button><button class=ic onclick="vsh[${i}]=!vsh[${i}];vlist()">${vsh[i]?'Sembunyikan':'Lihat'}</button>`:''}<button class=ic onclick="vform(${i})">${I('edit',18)}</button><button class=ic onclick="vdel(${i})">${I('trash',18)}</button></div></div>`).join('')||'<p class=sub>Belum ada akun. Ketuk Tambah.</p>'}
function vcp(i,k){navigator.clipboard.writeText(V[i][k]).then(()=>{toast('Disalin. Clipboard bisa dibaca aplikasi lain, otomatis dikosongkan 30 detik.');setTimeout(()=>navigator.clipboard.writeText('').catch(()=>0),3e4)}).catch(()=>toast('Gagal menyalin'))}
async function vfav(i){V[i].fav=!V[i].fav;const{id,upd,...o}=V[i];await sb.from('vault_items').update({data:await seal(o)}).eq('id',id);vlist()}
function vform(i){const v=i==null?{}:V[i],f=(k,l,t='text')=>`<label>${l}<input id=v_${k} type=${t} value="${esc(v[k]||'')}" autocomplete=off></label>`;
 $('#mod').innerHTML=`<div class=modal><div><h3>${i==null?'Tambah':'Edit'} akun</h3>${f('name','Nama website / aplikasi')}<label>Kategori<select id=v_cat>${VC.map(c=>`<option ${c==v.cat?'selected':''}>${c}</option>`).join('')}</select></label>${f('url','URL website')}${f('email','Email login')}${f('username','Username / NIM')}${f('password','Password','password')}<button class=ic onclick="const e=$('#v_password');e.type=e.type=='password'?'text':'password'">Tampilkan / sembunyikan password</button>${f('owner','Nama pemilik akun')}<label>Catatan<textarea id=v_note>${esc(v.note||'')}</textarea></label><div class=row style="margin-top:10px"><button class=pri onclick="vsv(${i==null?'null':i})">Simpan</button><button onclick="$('#mod').innerHTML=''">Batal</button></div></div></div>`}
async function vsv(i){const o={};['name','cat','url','email','username','password','owner','note'].forEach(k=>o[k]=$('#v_'+k).value.trim());if(!o.name)return alert('Nama wajib diisi');
 if(o.url&&!/^https?:\/\//i.test(o.url))o.url='https://'+o.url;if(i!=null&&V[i].fav)o.fav=true;
 const d=await seal(o),{error}=await(i==null?sb.from('vault_items').insert({data:d}):sb.from('vault_items').update({data:d,updated_at:new Date().toISOString()}).eq('id',V[i].id));
 if(error)return alert(error.message);$('#mod').innerHTML='';render()}
async function vdel(i){if(confirm('Hapus akun ini?')){await sb.from('vault_items').delete().eq('id',V[i].id);render()}}
async function vexport(){const[m,it]=await Promise.all([sb.from('vault_meta').select('salt,check_blob'),sb.from('vault_items').select('data,created_at,updated_at')]);const b=new Blob([JSON.stringify({meta:m.data,items:it.data})],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='vault-terenkripsi.json';l.click()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
Promise.race([boot(),new Promise((_,r)=>setTimeout(()=>r(new Error('Koneksi ke Supabase terlalu lama. Cek internet lalu muat ulang.')),15000))]).catch(e=>showErr(e.message||JSON.stringify(e)));
</script></body></html>
